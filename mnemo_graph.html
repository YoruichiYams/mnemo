<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnemo Memory - Knowledge Flow</title>
    <!-- Google Fonts: Google Sans Flex & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #050507;
            --bg-card: #0b0c0e;
            --border: #1a1c22;
            --text-primary: #f0f2f5;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --font-main: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            padding: 32px 28px;
            min-height: 100vh;
        }
        .header {
            max-width: 1240px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        .title-group h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .title-group p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 400;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 4px;
        }
        .zoom-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.12s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .zoom-btn:hover {
            color: var(--text-primary);
            background: #1a1c22;
        }
        .reset-btn {
            font-size: 10px;
            letter-spacing: 0.04em;
            border-left: 1px solid var(--border);
            border-radius: 0 3px 3px 0;
            padding-left: 8px;
        }
        .badge {
            font-size: 11px;
            font-family: var(--font-mono);
            background: #111318;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }
        .metrics-grid {
            max-width: 1240px;
            margin: 0 auto 20px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 16px;
        }
        .metric-card .label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 500;
        }
        .metric-card .value {
            font-size: 20px;
            font-weight: 600;
            margin-top: 4px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            letter-spacing: -0.02em;
        }
        .chart-container {
            max-width: 1240px;
            margin: 0 auto;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            height: 600px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .chart-container:active {
            cursor: grabbing;
        }
        #sankey-plot {
            width: 100%;
            height: 100%;
        }
        /* Plotly Modebar Styling for Deep Black */
        .modebar-container {
            top: 8px !important;
            right: 8px !important;
        }
        .modebar {
            background: transparent !important;
        }
        .modebar-btn svg path {
            fill: #70737d !important;
        }
        .modebar-btn:hover svg path {
            fill: #f0f2f5 !important;
        }
        .modebar-btn.active svg path {
            fill: #58a6ff !important;
        }
        .footer {
            max-width: 1240px;
            margin: 16px auto 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
    </style>
</head>

        </div>
        <div class="header-actions">
            <div class="zoom-controls">

                <button class="zoom-btn reset-btn" onclick="resetZoom()" title="Reset View">&#x27F2; Reset</button>
            </div>
            <div class="badge">SQLite WAL &bull; RRF k=60</div>
        </div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="label">Active Facts</div>
            <div class="value">132</div>
        </div>
        <div class="metric-card">
            <div class="label">Entities / Nodes</div>
            <div class="value">757</div>
        </div>
        <div class="metric-card">
            <div class="label">Graph Relations</div>
            <div class="value">619</div>
        </div>
        <div class="metric-card">
            <div class="label">Core Tier Memory</div>
            <div class="value">17.5%</div>
        </div>
        <div class="metric-card">
            <div class="label">Mean Salience S(t)</div>
            <div class="value">0.290</div>
        </div>
    </div>

    <div class="chart-container" id="chartWrapper">
        <div id="sankey-plot"></div>
    </div>

    <div class="footer">
        <div>Mnemo Memory Engine</div>
        <div>Dark Minimal &bull; Zero-Dependency HTML</div>
    </div>

                currentZoom = Math.max(0.3, Math.min(5.0, currentZoom * zoomFactor));
                applyTransform();
            }, { passive: false });

            container.addEventListener("mousedown", (e) => {
                if (e.button === 0) {
                    isPanning = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                }
            });

            window.addEventListener("mousemove", (e) => {
                if (!isPanning) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                applyTransform();
            });

            window.addEventListener("mouseup", () => {
                if (isPanning) {
                    isPanning = false;
                    applyTransform();
                }
            });
        }
    </script>
</body>
</html>
